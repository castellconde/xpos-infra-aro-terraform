# =========================================================================================
# Operador Streams for Apache Kafka en ARO - Clúster KRaft en 3 Zonas (RF=3, min.insync.replicas=2)
# =========================================================================================
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: xpos-kafka-kraft-pool
  namespace: xpos-cde-pci
  labels:
    strimzi.io/cluster: xpos-kafka-cluster
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 500Gi
        class: managed-csi-premium
        deleteClaim: false
  template:
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: strimzi.io/name
                    operator: In
                    values:
                      - xpos-kafka-cluster-kafka
              topologyKey: topology.kubernetes.io/zone
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: xpos-kafka-cluster
  namespace: xpos-cde-pci
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.8.0
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      compression.type: lz4
    rack:
      topologyKey: topology.kubernetes.io/zone
  entityOperator:
    topicOperator: {}
    userOperator: {}
